<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Racing Master TIER</title>
  
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #162135; 
      --panel-hover: #1e2d46; 
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --ecu-active: #38bdf8;
      --ecu-glow: rgba(56, 189, 248, 0.35);
      --green: #22c55e;
      --red: #ef4444;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #fb923c;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: -0.2px;
    }

    button { font: inherit; cursor: pointer; }

    /* 헤더 영역 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 11, 18, 0.92);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: min(1000px, calc(100% - 24px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
    }

    .brand {
      justify-self: start;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      text-transform: uppercase;
      line-height: 1;
    }

    /* 브랜드 바로 밑 서브 타이틀 문구 */
    .brand-sub {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap;
    }

    .nav-container {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .region-tabs {
      justify-self: end;
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.3);
    }

    .region-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      line-height: 1;
      transition: all 0.2s ease;
    }

    .region-btn:hover { color: var(--text); }
    .region-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.12);
    }

    .tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tab {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 0 20px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab[aria-selected="true"] {
      background: var(--accent);
      color: #080c14;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .state-tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
    }

    .state-tab {
      min-height: 28px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      padding: 0 12px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .state-tab[aria-selected="true"] {
      background: var(--ecu-active);
      color: #05070c;
      box-shadow: 0 0 10px var(--ecu-glow);
    }

    main {
      width: min(1000px, calc(100% - 24px));
      margin: 10px auto 30px;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 30px;
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 6px 8px;
    }

    .metric-map {
      width: 46px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #05070c;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .metric-map img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .metric-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .metric-body span.track-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-body strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .metric-body span.track-car {
      display: block;
      color: var(--green);
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .car-card {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      gap: 60px;
      box-shadow: var(--shadow);
      width: 100%;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .car-card:nth-child(5n):not(:last-child) {
      margin-bottom: 30px; 
    }

    .car-card:hover {
      border-color: var(--line-strong);
      background: var(--panel-hover);
    }

    .block-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 420px;
      max-width: 420px;
      min-width: 0;
    }

    .rank-badge {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      background: var(--line);
      color: var(--text);
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }

    .rank-medal {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0;
      background: transparent;
    }

    .car-image {
      width: 90px;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #05070c;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .car-name {
      margin: 0;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .car-sub-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .car-max { color: #38bdf8; }
    .car-tuning { color: var(--accent); }

    .car-score-large {
      font-size: 22px;
      font-weight: 900;
      color: var(--red);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
      padding-left: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .block-tracks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .track-cell {
      background: transparent;
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      min-width: 0;
    }

    .track-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 15px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .track-cell.best-record .track-time {
      color: var(--green);
    }

    .empty {
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    /* 플로팅 버튼 */
    .floating-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #080c14;
      border: none;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 4px 15px var(--accent-glow);
      z-index: 90;
      transition: transform 0.2s ease, background-color 0.2s ease;
      display: grid;
      place-items: center;
    }

    .floating-btn:hover {
      transform: scale(1.1);
      background: #fbbf24;
    }

    /* 안내 팝업 모달 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      width: min(460px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      transform: translateY(10px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.open .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 24px;
      line-height: 1;
      padding: 0;
      transition: color 0.2s ease;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .modal-body {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
      word-break: keep-all;
    }

    .modal-body p {
      margin: 0 0 14px 0;
    }

    .modal-body p:last-child {
      margin-bottom: 0;
    }

    .modal-body a {
      color: var(--accent);
      text-decoration: underline;
      word-break: break-all;
    }

    /* 모바일 반응형 */
    @media (max-width: 960px) {
      .metric-map { width: 42px; }
      .metric-body span.track-label { font-size: 10px; }
      .metric-body strong { font-size: 14px; }
      .metric-body span.track-car { font-size: 10.5px; }
      .rank-badge { width: 28px; height: 28px; font-size: 13px; }
      .rank-medal { width: 28px; height: 28px; font-size: 20px; }
      .car-image { width: 70px; } 
      .car-name { font-size: 13.5px; }
      .car-sub-info { font-size: 11px; }
      .car-score-large { font-size: 20px; }
      
      .card-list { gap: 10px; }
      .car-card {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 4px 8px;
      }
      .block-info {
        width: 100%;
        max-width: none;
        flex: none;
        padding-bottom: 5px;
        border-bottom: 1px solid var(--line-strong);
      }
      .block-tracks {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }
      .track-cell { padding: 2px 4px; }
      .track-name { font-size: 9px; }
      .track-time { font-size: 11px; }
    }

    @media (max-width: 640px) {
      .header-inner,
      main { width: min(100% - 12px, 1000px); }
      
      .header-inner {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto auto;
        gap: 10px 8px;
        padding: 10px 4px;
      }

      .brand {
        grid-column: 1 / 2;
        grid-row: 1 / 2;
        justify-self: start;
        align-self: center;
      }

      .brand-sub {
        font-size: 10px;
      }
      
      .region-tabs {
        grid-column: 2 / 3;
        grid-row: 1 / 2;
        justify-self: end;
        align-self: center;
        padding: 2px;
      }

      .region-btn {
        font-size: 11px;
        padding: 2px 6px;
      }
      
      .nav-container {
        grid-column: 1 / 3;
        grid-row: 2 / 4;
        justify-self: center;
        width: 100%;
      }
      
      .tabs {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 2px;
      }
      
      .tab {
        padding: 0 4px;
        font-size: 12px;
        min-height: 32px;
        text-align: center;
      }

      .state-tabs {
        width: auto;
        display: inline-flex;
        justify-content: center;
      }

      .state-tab {
        min-height: 28px;
        padding: 0 10px;
        font-size: 11px;
      }

      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .track-name { font-size: 8.5px; }
      
      .floating-btn {
        bottom: 16px;
        right: 16px;
        width: 42px;
        height: 42px;
        font-size: 20px;
      }

      .modal-body {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Racing Master TIER</h1>
        <p class="brand-sub" id="brandSub">한국 일본 동남아 서버 차량 기준 티어표 입니다</p>
      </div>

      <div class="nav-container">
        <nav class="tabs" aria-label="차량 클래스">
          <button class="tab" data-class="standard" aria-selected="true">스탠다드</button>
          <button class="tab" data-class="performance" aria-selected="false">퍼포먼스</button>
          <button class="tab" data-class="extreme" aria-selected="false">익스트림</button>
        </nav>
        <div class="state-tabs" aria-label="돌파 상태">
          <button class="state-tab" data-state="base" aria-selected="true">ECU 0</button>
          <button class="state-tab" data-state="full" aria-selected="false">ECU 5</button>
          <button class="state-tab" data-state="efficiency" aria-selected="false">돌파효율</button>
        </div>
      </div>
      
      <div class="region-tabs" aria-label="언어 선택">
        <button class="region-btn" data-region="kr">KR</button>
        <button class="region-btn" data-region="jp">JP</button>
        <button class="region-btn" data-region="sea">SEA</button>
      </div>
    </div>
  </header>

  <main>
    <section class="metric-strip" id="metrics" aria-label="최고 기록"></section>
    <div class="card-list" id="cardList"></div>
  </main>

  <button id="infoBtn" class="floating-btn" aria-label="안내사항">?</button>

  <div id="infoModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">NOTICE</h3>
        <button id="closeModalBtn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modalP1"></p>
        <p id="modalP2"></p>
        <p id="modalContact"></p>
      </div>
    </div>
  </div>

  <script>
    const i18n = {
      kr: {
        tune: "튜닝",
        ecuEfficiency: "돌파효율",
        subTitle: "한국 일본 동남아 서버 차량 기준 티어표 입니다",
        classes: {
          standard: "스탠다드",
          performance: "퍼포먼스",
          extreme: "익스트림"
        },
        notice: {
          title: "NOTICE",
          p1: "이 사이트는 중국/대만 서버와 나머지 서버의 값이 달라서 KR / JP / SEA 서버에서 참고 할 수 있도록 제작되었습니다.",
          p2: "돌파효율이 높은 차는 ECU 강화를 많이 할수록 좋아지고 반대로 낮은 차는 ECU 0 상태로도 좋은 차라고 해석할 수도 있습니다.",
          contact: "수정 요청, 기록 제보는 "
        },
        getTrack: (originalName) => {
          if (originalName.includes("스카이트리")) return { full: "도쿄 스카이트리 하프", short: "스카이트리 하프" };
          if (originalName.includes("진주해안")) return { full: "시칠리아 진주해안", short: "시칠리아 진주해안" };
          if (originalName.includes("클래식")) return { full: "인디애나폴리스 클래식 서킷 리버스", short: "클래식 서킷 리버스" };
          if (originalName.includes("피에스타")) return { full: "레드불 링 서킷 피에스타 서킷", short: "피에스타 서킷" };
          return { full: originalName, short: originalName };
        }
      },
      sea: {
        tune: "Tune",
        ecuEfficiency: "Boost",
        subTitle: "Vehicle tier list based on SEA, KR, and JP servers.",
        classes: {
          standard: "Standard",
          performance: "Sports",
          extreme: "Extreme"
        },
        notice: {
          title: "NOTICE",
          p1: "This site is created for players on KR, JP, and SEA servers, as vehicle stats differ from CN and TW servers.",
          p2: "Cars with high ECU efficiency improve significantly as you upgrade ECU, while cars with low efficiency are already great choices at ECU 0.",
          contact: "Corrections & Record Submissions: "
        },
        getTrack: (originalName) => {
          if (originalName.includes("스카이트리")) return { full: "Tokyo Skytree / Half", short: "Skytree / Half" };
          if (originalName.includes("진주해안")) return { full: "Sicily Island Pearl Beach", short: "Pearl Beach" };
          if (originalName.includes("클래식")) return { full: "Indianapolis Classic / Reverse", short: "Indy Classic / Reverse" };
          if (originalName.includes("피에스타")) return { full: "Red Bull Ring Fiesta Circuit", short: "Fiesta Circuit" };
          return { full: originalName, short: originalName };
        }
      },
      jp: {
        tune: "チューン",
        ecuEfficiency: "強化効率",
        subTitle: "日本・韓国・東南アジアサーバーの車両基準ティア表です。",
        classes: {
          standard: "スポーツ",
          performance: "パフォーマンス",
          extreme: "レーシング"
        },
        notice: {
          title: "NOTICE",
          p1: "当サイトは中国/台湾サーバーと仕様が異なるため、KR / JP / SEAサーバーの参考にしていただけるよう作成されました。",
          p2: "突破効率が高いマシンはECU強化を進めるほど真価を発揮し、逆に効率が低いマシンはECU 0の状態でも優秀なマシンと言えます。",
          contact: "修正リクエスト・記録の提供: "
        },
        getTrack: (originalName) => {
          if (originalName.includes("스카이트리")) return { full: "東京 スカイツリー/ハーフ", short: "スカイツリー/ハーフ" };
          if (originalName.includes("진주해안")) return { full: "シチリア島 パールビーチ", short: "パールビーチ" };
          if (originalName.includes("클래식")) return { full: "インディアナポリス クラシック/逆回り", short: "クラシック/逆回り" };
          if (originalName.includes("피에스타")) return { full: "レッドブル・リンク・カーニバル", short: "カーニバル" };
          return { full: originalName, short: originalName };
        }
      }
    };

    function getInitialRegion() {
      const saved = localStorage.getItem("rm_region");
      if (saved && ["kr", "jp", "sea"].includes(saved)) return saved;

      const lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (lang.startsWith("ko")) return "kr";
      if (lang.startsWith("ja")) return "jp";
      return "sea";
    }

    const state = { class: "standard", breakthrough: "base", region: getInitialRegion(), data: null };
    const els = {
      classTabs: document.querySelectorAll(".tab"),
      stateTabs: document.querySelectorAll(".state-tab"),
      regionBtns: document.querySelectorAll(".region-btn"),
      cardList: document.getElementById("cardList"),
      metrics: document.getElementById("metrics"),
      brandSub: document.getElementById("brandSub"),
      infoBtn: document.getElementById("infoBtn"),
      infoModal: document.getElementById("infoModal"),
      closeModalBtn: document.getElementById("closeModalBtn")
    };

    init();

    async function init() {
      bindEvents();
      try {
        const response = await fetch("racingmaster-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("data file missing");
        state.data = await response.json();
      } catch {
        state.data = { tracks: [], cars: [] };
        els.cardList.innerHTML = `<div class="empty">racingmaster-data.json 파일을 같은 폴더에 올려주세요.</div>`;
        return;
      }
      render();
    }

    function bindEvents() {
      els.classTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.class = button.dataset.class;
          render();
        });
      });
      els.stateTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.breakthrough = button.dataset.state;
          render();
        });
      });
      els.regionBtns.forEach((button) => {
        button.addEventListener("click", () => {
          state.region = button.dataset.region;
          localStorage.setItem("rm_region", state.region);
          render();
        });
      });

      els.infoBtn.addEventListener("click", openModal);
      els.closeModalBtn.addEventListener("click", closeModal);
      els.infoModal.addEventListener("click", (e) => {
        if (e.target === els.infoModal) closeModal();
      });
    }

    function openModal() {
      const currentLang = i18n[state.region] || i18n.kr;
      const n = currentLang.notice;

      document.getElementById("modalTitle").textContent = n.title;
      document.getElementById("modalP1").textContent = n.p1;
      document.getElementById("modalP2").textContent = n.p2;
      document.getElementById("modalContact").innerHTML = `${n.contact} <a href="mailto:racing.tier@gmail.com">racing.tier@gmail.com</a>`;

      els.infoModal.classList.add("open");
      els.infoModal.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      els.infoModal.classList.remove("open");
      els.infoModal.setAttribute("aria-hidden", "true");
    }

    function render() {
      syncTabs();
      const ranked = getRankedCars();
      renderMetrics(ranked);
      renderCards(ranked);
    }

    function syncTabs() {
      const currentLang = i18n[state.region] || i18n.kr;

      if (els.brandSub && currentLang.subTitle) {
        els.brandSub.textContent = currentLang.subTitle;
      }

      els.classTabs.forEach((button) => {
        const cls = button.dataset.class;
        button.setAttribute("aria-selected", String(cls === state.class));
        if (currentLang.classes[cls]) {
          button.textContent = currentLang.classes[cls];
        }
      });

      els.stateTabs.forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.state === state.breakthrough));
        if (button.dataset.state === "efficiency") {
          button.textContent = currentLang.ecuEfficiency;
        }
      });

      els.regionBtns.forEach((button) => {
        button.classList.toggle("active", button.dataset.region === state.region);
      });
    }

    function getRankedCars() {
      const cars = state.data.cars.filter((car) => car.class === state.class);
      if (!cars.length) return [];
      if (state.breakthrough === "efficiency") {
        return cars
          .map((car) => ({ ...car, scoreData: calculateEfficiencyScore(car) }))
          .sort((a, b) => b.scoreData.averageEfficiency - a.scoreData.averageEfficiency || a.name.localeCompare(b.name, "ko"));
      }
      const bestRecords = getBestRecords(cars);
      return cars
        .map((car) => ({ ...car, scoreData: calculateScore(car, bestRecords) }))
        .sort((a, b) => a.scoreData.totalGap - b.scoreData.totalGap || a.name.localeCompare(b.name, "ko"));
    }

    function getBestRecords(cars) {
      if (state.breakthrough === "efficiency") {
        return getBestEfficiencies(cars);
      }
      return state.data.tracks.reduce((acc, track) => {
        acc[track.id] = Math.min(...cars.map((car) => car.records[state.breakthrough][track.id]));
        return acc;
      }, {});
    }

    function calculateScore(car, bestRecords) {
      const totalGap = state.data.tracks.reduce((sum, track) => {
        const record = car.records[state.breakthrough][track.id];
        return sum + ((record - bestRecords[track.id]) / bestRecords[track.id]) * 100;
      }, 0);

      const score = Math.max(0, 100 - totalGap).toFixed(2);
      return { totalGap, score };
    }

    function calculateEfficiencyScore(car) {
      const efficiencies = getCarEfficiencies(car);
      const totalEfficiency = state.data.tracks.reduce((sum, track) => sum + efficiencies[track.id], 0);
      const averageEfficiency = totalEfficiency / state.data.tracks.length;
      return {
        efficiencies,
        averageEfficiency,
        score: `${averageEfficiency.toFixed(2)}%`
      };
    }

    function getCarEfficiencies(car) {
      return state.data.tracks.reduce((acc, track) => {
        const baseRecord = car.records.base[track.id];
        const fullRecord = car.records.full[track.id];
        acc[track.id] = baseRecord > 0 ? ((baseRecord - fullRecord) / baseRecord) * 100 : 0;
        return acc;
      }, {});
    }

    function getBestEfficiencies(cars) {
      return state.data.tracks.reduce((acc, track) => {
        acc[track.id] = Math.max(...cars.map((car) => getCarEfficiencies(car)[track.id]));
        return acc;
      }, {});
    }

    function renderMetrics(cars) {
      if (!cars.length) {
        els.metrics.innerHTML = "";
        return;
      }
      const best = getBestRecords(cars);
      const currentLang = i18n[state.region] || i18n.kr;

      els.metrics.innerHTML = state.data.tracks.map((track, idx) => {
        const bestCar = state.breakthrough === "efficiency"
          ? cars.find((car) => car.scoreData.efficiencies[track.id] === best[track.id])
          : cars.find((car) => car.records[state.breakthrough][track.id] === best[track.id]);
        const mapNum = idx + 1;
        const mapImgSrc = `images/map/map${mapNum}.png`;
        
        const trackNames = currentLang.getTrack(track.name);

        return `
          <article class="metric">
            <div class="metric-map">
              <img src="${mapImgSrc}" alt="${escapeHtml(trackNames.full)}">
            </div>
            <div class="metric-body">
              <span class="track-label">${escapeHtml(trackNames.full)}</span>
              <strong>${state.breakthrough === "efficiency" ? formatPercent(best[track.id]) : formatTime(best[track.id])}</strong>
              <span class="track-car">${bestCar ? escapeHtml(bestCar.name) : ""}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCards(cars) {
      if (!cars.length) {
        els.cardList.innerHTML = `<div class="empty">표시할 차량이 없습니다.</div>`;
        return;
      }
      
      const best = getBestRecords(cars);
      const tracks = state.data.tracks;
      const currentLang = i18n[state.region] || i18n.kr;

      els.cardList.innerHTML = cars.map((car, index) => {
        const rank = index + 1;
        
        let rankHtml = '';
        if (rank === 1) rankHtml = `<span class="rank-medal">🥇</span>`;
        else if (rank === 2) rankHtml = `<span class="rank-medal">🥈</span>`;
        else if (rank === 3) rankHtml = `<span class="rank-medal">🥉</span>`;
        else rankHtml = `<span class="rank-badge">${rank}</span>`;

        const tuningVal = car.tuning ? escapeHtml(car.tuning) : "00000";
        const maxPointVal = car.maxPoint !== undefined && car.maxPoint !== null ? escapeHtml(car.maxPoint) : "-";
        const scoreVal = car.scoreData.score;

        const trackBlocksHtml = tracks.map((track) => {
          const isEfficiency = state.breakthrough === "efficiency";
          const recordMs = isEfficiency ? null : car.records[state.breakthrough][track.id];
          const efficiency = isEfficiency ? car.scoreData.efficiencies[track.id] : null;
          const isBest = isEfficiency ? efficiency === best[track.id] : recordMs === best[track.id];
          
          const trackNames = currentLang.getTrack(track.name);

          return `
            <div class="track-cell ${isBest ? 'best-record' : ''}">
              <span class="track-name" title="${escapeHtml(trackNames.full)}">${escapeHtml(trackNames.short)}</span>
              <span class="track-time">${isEfficiency ? formatPercent(efficiency) : formatTime(recordMs)}</span>
            </div>
          `;
        }).join("");

        return `
          <article class="car-card">
            <div class="block-info">
              ${rankHtml}
              <div class="car-image">
                ${imageSrc(car) ? `<img src="${escapeHtml(imageSrc(car))}" alt="${escapeHtml(car.name)}">` : `<span aria-hidden="true"></span>`}
              </div>
              <div class="car-meta">
                <p class="car-name" title="${escapeHtml(car.name)}">${escapeHtml(car.name)}</p>
                <div class="car-sub-info">
                  <span class="car-max">MAX : ${maxPointVal}</span>
                  <span class="car-tuning">${currentLang.tune}: ${tuningVal}</span>
                </div>
              </div>
              <div class="car-score-large">${scoreVal}</div>
            </div>
            <div class="block-tracks">
              ${trackBlocksHtml}
            </div>
          </article>
        `;
      }).join("");
    }

    function formatTime(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${String(seconds).padStart(2, "0")}.${String(milliseconds).padStart(3, "0")}`;
    }

    function formatPercent(value) {
      return `${value.toFixed(2)}%`;
    }

    function imageSrc(car) {
      if (car.imageName) return `images/${car.class}/${car.imageName}`;
      if (car.imageUrl) return car.imageUrl;
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
