<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Racing Master TIER</title>
  
  <!-- Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #0e1624;
      --panel-hover: #141f32;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --line: #1e293b;
      --line-strong: #334155;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --ecu-active: #38bdf8;
      --ecu-glow: rgba(56, 189, 248, 0.35);
      --green: #22c55e;
      --red: #ef4444;
      --gold: #fbbf24;
      --silver: #94a3b8;
      --bronze: #fb923c;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      letter-spacing: -0.2px;
    }

    button { font: inherit; cursor: pointer; }

    /* 헤더 영역 (상단 고정) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 11, 18, 0.92);
      backdrop-filter: blur(12px);
    }

    .header-inner {
      width: min(1000px, calc(100% - 24px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
    }

    .brand {
      justify-self: start;
    }

    /* 타이틀 폰트 사이즈 1.2배 확대 (15px~20px -> 18px~24px) */
    h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      text-transform: uppercase;
    }

    /* 중앙 네비게이션 컨테이너 */
    .nav-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* 클래스 탭 */
    .tabs {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .tab {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 0 20px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab[aria-selected="true"] {
      background: var(--accent);
      color: #080c14;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ECU 상태 탭 */
    .state-tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.4);
    }

    .state-tab {
      min-height: 28px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      padding: 0 12px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .state-tab[aria-selected="true"] {
      background: var(--ecu-active);
      color: #05070c;
      box-shadow: 0 0 10px var(--ecu-glow);
    }

    .header-spacer {
      width: 100%;
    }

    /* 메인 콘텐츠 */
    main {
      width: min(1000px, calc(100% - 24px));
      margin: 10px auto 30px;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 30px;
    }

    .metric {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      padding: 6px 8px;
    }

    .metric-map {
      width: 46px;
      aspect-ratio: 1 / 1;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #05070c;
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .metric-map img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .metric-body {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .metric-body span.track-label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-body strong {
      display: block;
      font-size: 16px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .metric-body span.track-car {
      display: block;
      color: var(--green);
      font-size: 11.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .car-card {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 10px;
      gap: 60px;
      box-shadow: var(--shadow);
      width: 100%;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    /* 5개 단위 여백 +10px 추가 (기존 margin 20px -> 30px) */
    .car-card:nth-child(5n):not(:last-child) {
      margin-bottom: 30px; 
    }

    .car-card:hover {
      border-color: var(--line-strong);
      background: var(--panel-hover);
    }

    .block-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 420px;
      max-width: 420px;
      min-width: 0;
    }

    .rank-badge {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      background: var(--line);
      color: var(--text);
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }

    .rank-1 { background: rgba(251, 191, 36, 0.15); color: var(--gold); border: 1px solid rgba(251, 191, 36, 0.4); }
    .rank-2 { background: rgba(148, 163, 184, 0.15); color: var(--silver); border: 1px solid rgba(148, 163, 184, 0.4); }
    .rank-3 { background: rgba(251, 146, 60, 0.15); color: var(--bronze); border: 1px solid rgba(251, 146, 60, 0.4); }

    /* 요청하신 차량 이미지 너비 90px 지정 */
    .car-image {
      width: 90px;
      aspect-ratio: 16 / 10;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #05070c;
      display: grid;
      place-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .car-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1;
    }

    .car-name {
      margin: 0;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .car-sub-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .car-max {
      color: #38bdf8;
    }

    .car-tuning {
      color: var(--accent);
    }

    .car-score-large {
      font-size: 22px;
      font-weight: 900;
      color: var(--red);
      font-variant-numeric: tabular-nums;
      margin-left: auto;
      padding-left: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .block-tracks {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .track-cell {
      background: rgba(15, 23, 42, 0.6);
      border: none;
      border-radius: 4px;
      padding: 4px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      min-width: 0;
    }

    .track-name {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-time {
      font-size: 13.5px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .track-cell.best-record .track-time {
      color: var(--green);
    }

    .empty {
      padding: 24px 16px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    /* ==== 모바일 및 태블릿 ==== */
    @media (max-width: 960px) {
      .metric-map { width: 42px; }
      .metric-body span.track-label { font-size: 10px; }
      .metric-body strong { font-size: 14px; }
      .metric-body span.track-car { font-size: 10.5px; }
      .rank-badge { width: 28px; height: 28px; font-size: 13px; }
      .car-image { width: 70px; } /* 모바일 가로 너비도 비례해서 조정 */
      .car-name { font-size: 13.5px; }
      .car-sub-info { font-size: 11px; }
      .car-score-large { font-size: 20px; }
      
      .card-list {
        gap: 10px;
      }
      .car-card {
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        padding: 4px 8px;
      }
      .block-info {
        width: 100%;
        max-width: none;
        flex: none;
        padding-bottom: 5px;
        border-bottom: 1px solid var(--line-strong);
      }
      .block-tracks {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }
      .track-cell {
        padding: 2px 4px;
      }
      .track-name { font-size: 9px; }
      .track-time { font-size: 11px; }
    }

    @media (max-width: 640px) {
      .header-inner,
      main { width: min(100% - 12px, 1000px); }
      
      .header-inner {
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 10px;
        padding: 10px 0;
      }

      .brand {
        justify-self: center;
      }
      
      /* 모바일 클래스 탭: 가로 폭 1.3배 지정 (width: 130%) */
      .tabs {
        width: 130%;
        max-width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        padding: 2px;
      }
      
      /* 모바일 클래스 탭: 높이를 ECU 탭과 동일한 28px로 축소 */
      .tab {
        padding: 0 4px;
        font-size: 12px;
        min-height: 28px;
        text-align: center;
      }

      .metric-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
      .track-name { font-size: 8.5px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>Racing Master TIER</h1>
      </div>
      
      <div class="nav-container">
        <nav class="tabs" aria-label="차량 클래스">
          <button class="tab" data-class="standard" aria-selected="true">스탠다드</button>
          <button class="tab" data-class="performance" aria-selected="false">퍼포먼스</button>
          <button class="tab" data-class="extreme" aria-selected="false">익스트림</button>
        </nav>
        <div class="state-tabs" aria-label="돌파 상태">
          <button class="state-tab" data-state="base" aria-selected="true">ECU 0</button>
          <button class="state-tab" data-state="full" aria-selected="false">ECU 5</button>
        </div>
      </div>
      
      <div class="header-spacer"></div>
    </div>
  </header>

  <main>
    <section class="metric-strip" id="metrics" aria-label="최고 기록"></section>
    <div class="card-list" id="cardList"></div>
  </main>

  <script>
    const state = { class: "standard", breakthrough: "base", data: null };
    const els = {
      classTabs: document.querySelectorAll(".tab"),
      stateTabs: document.querySelectorAll(".state-tab"),
      cardList: document.getElementById("cardList"),
      metrics: document.getElementById("metrics")
    };

    init();

    async function init() {
      bindEvents();
      try {
        const response = await fetch("racingmaster-data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("data file missing");
        state.data = await response.json();
      } catch {
        state.data = { tracks: [], cars: [] };
        els.cardList.innerHTML = `<div class="empty">racingmaster-data.json 파일을 같은 폴더에 올려주세요.</div>`;
        return;
      }
      render();
    }

    function bindEvents() {
      els.classTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.class = button.dataset.class;
          render();
        });
      });
      els.stateTabs.forEach((button) => {
        button.addEventListener("click", () => {
          state.breakthrough = button.dataset.state;
          render();
        });
      });
    }

    function render() {
      syncTabs();
      const ranked = getRankedCars();
      renderMetrics(ranked);
      renderCards(ranked);
    }

    function syncTabs() {
      els.classTabs.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.class === state.class)));
      els.stateTabs.forEach((button) => button.setAttribute("aria-selected", String(button.dataset.state === state.breakthrough)));
    }

    function getRankedCars() {
      const cars = state.data.cars.filter((car) => car.class === state.class);
      if (!cars.length) return [];
      const bestRecords = getBestRecords(cars);
      return cars
        .map((car) => ({ ...car, scoreData: calculateScore(car, bestRecords) }))
        .sort((a, b) => a.scoreData.totalGap - b.scoreData.totalGap || a.name.localeCompare(b.name, "ko"));
    }

    function getBestRecords(cars) {
      return state.data.tracks.reduce((acc, track) => {
        acc[track.id] = Math.min(...cars.map((car) => car.records[state.breakthrough][track.id]));
        return acc;
      }, {});
    }

    function calculateScore(car, bestRecords) {
      const totalGap = state.data.tracks.reduce((sum, track) => {
        const record = car.records[state.breakthrough][track.id];
        return sum + ((record - bestRecords[track.id]) / bestRecords[track.id]) * 100;
      }, 0);

      const score = Math.max(0, 100 - totalGap).toFixed(2);
      return { totalGap, score };
    }

    function renderMetrics(cars) {
      if (!cars.length) {
        els.metrics.innerHTML = "";
        return;
      }
      const best = getBestRecords(cars);
      els.metrics.innerHTML = state.data.tracks.map((track, idx) => {
        const bestCar = cars.find((car) => car.records[state.breakthrough][track.id] === best[track.id]);
        const mapNum = idx + 1;
        const mapImgSrc = `images/map/map${mapNum}.png`;
        return `
          <article class="metric">
            <div class="metric-map">
              <img src="${mapImgSrc}" alt="${escapeHtml(track.name)}">
            </div>
            <div class="metric-body">
              <span class="track-label">${escapeHtml(track.name)}</span>
              <strong>${formatTime(best[track.id])}</strong>
              <span class="track-car">${bestCar ? escapeHtml(bestCar.name) : ""}</span>
            </div>
          </article>
        `;
      }).join("");
    }

    function renderCards(cars) {
      if (!cars.length) {
        els.cardList.innerHTML = `<div class="empty">표시할 차량이 없습니다.</div>`;
        return;
      }
      
      const best = getBestRecords(cars);
      const tracks = state.data.tracks;

      els.cardList.innerHTML = cars.map((car, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : "";
        const tuningVal = car.tuning ? escapeHtml(car.tuning) : "00000";
        const maxPointVal = car.maxPoint !== undefined && car.maxPoint !== null ? escapeHtml(car.maxPoint) : "-";
        const scoreVal = car.scoreData.score;

        const trackBlocksHtml = tracks.map((track) => {
          const recordMs = car.records[state.breakthrough][track.id];
          const isBest = recordMs === best[track.id];
          
          let trackDisplayName = track.name;
          if (trackDisplayName.includes("스카이트리")) {
            trackDisplayName = "스카이트리 하프";
          } else if (trackDisplayName.includes("진주해안")) {
            trackDisplayName = "진주해안";
          } else if (trackDisplayName.includes("클래식")) {
            trackDisplayName = "클래식 서킷 리버스";
          } else if (trackDisplayName.includes("피에스타")) {
            trackDisplayName = "피에스타 서킷";
          }

          return `
            <div class="track-cell ${isBest ? 'best-record' : ''}">
              <span class="track-name" title="${escapeHtml(track.name)}">${escapeHtml(trackDisplayName)}</span>
              <span class="track-time">${formatTime(recordMs)}</span>
            </div>
          `;
        }).join("");

        return `
          <article class="car-card">
            <div class="block-info">
              <span class="rank-badge ${rankClass}">${rank}</span>
              <div class="car-image">
                ${imageSrc(car) ? `<img src="${escapeHtml(imageSrc(car))}" alt="${escapeHtml(car.name)}">` : `<span aria-hidden="true"></span>`}
              </div>
              <div class="car-meta">
                <p class="car-name" title="${escapeHtml(car.name)}">${escapeHtml(car.name)}</p>
                <div class="car-sub-info">
                  <span class="car-max">MAX : ${maxPointVal}</span>
                  <span class="car-tuning">튜닝: ${tuningVal}</span>
                </div>
              </div>
              <div class="car-score-large">${scoreVal}</div>
            </div>
            <div class="block-tracks">
              ${trackBlocksHtml}
            </div>
          </article>
        `;
      }).join("");
    }

    function formatTime(ms) {
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${String(seconds).padStart(2, "0")}.${String(milliseconds).padStart(3, "0")}`;
    }

    function imageSrc(car) {
      if (car.imageName) return `images/${car.class}/${car.imageName}`;
      if (car.imageUrl) return car.imageUrl;
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
